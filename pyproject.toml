[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostbussocket"
version = "0.1.0"
description = "HTTP-to-Socket.IO intermediary keyed by X-License-Key"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "python-socketio",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
